<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Pulse - Acesso à Conta</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    
    :root {
      --bg-main: #030407;
      --bg-card: rgba(13, 16, 23, 0.75);
      --border-card: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(34, 197, 94, 0.3);
      --accent-green: #22c55e;
      --accent-neon: #4ade80;
      --green-glow: 0 0 25px rgba(34, 197, 94, 0.4);
      --text-main: #f4f4f5;
      --text-muted: #71717a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(34, 197, 94, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(16, 185, 129, 0.05) 0%, transparent 40%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    header {
      width: 100%;
      border-bottom: 1px solid var(--border-card);
      background: rgba(3, 4, 7, 0.85);
      backdrop-filter: blur(20px);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1rem;
      width: 100%;
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 70px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 0.875rem;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #22c55e 0%, #10b981 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      box-shadow: var(--green-glow);
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(20, 24, 33, 0.9);
      border: 1px solid var(--border-card);
      color: var(--text-main);
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 0.875rem;
      font-size: 0.8125rem;
      font-weight: 700;
      transition: all 0.2s ease;
    }

    .nav-link:hover {
      border-color: var(--accent-green);
      color: var(--accent-neon);
      box-shadow: var(--green-glow);
    }

    main {
      width: 100%;
      max-width: 440px;
      padding: 2rem 1rem;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 1.5rem;
      padding: 2rem 1.5rem;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      width: 100%;
    }

    .tabs-container {
      display: flex;
      background: rgba(3, 4, 7, 0.8);
      border: 1px solid var(--border-card);
      border-radius: 0.875rem;
      padding: 4px;
      margin-bottom: 1.5rem;
    }

    .tab-btn {
      flex: 1;
      padding: 0.625rem;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.8125rem;
      font-weight: 700;
      border-radius: 0.625rem;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.2), rgba(16, 185, 129, 0.1));
      color: var(--accent-neon);
      border: 1px solid var(--border-accent);
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.15);
    }

    .form-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 0.25rem;
    }

    .form-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-muted);
      margin-bottom: 0.375rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 1rem;
      color: var(--text-muted);
      width: 18px;
      height: 18px;
    }

    .form-input {
      width: 100%;
      background-color: #030407;
      border: 1px solid var(--border-card);
      border-radius: 0.875rem;
      padding: 0.75rem 1rem 0.75rem 2.75rem;
      font-size: 0.875rem;
      color: #fff;
      outline: none;
      font-family: inherit;
      transition: all 0.2s;
    }

    .form-input:focus {
      border-color: var(--accent-green);
      box-shadow: var(--green-glow);
    }

    .btn-submit {
      background: linear-gradient(135deg, #22c55e, #15803d);
      color: #000;
      font-weight: 800;
      font-size: 0.875rem;
      padding: 0.875rem;
      border-radius: 0.875rem;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      margin-top: 0.5rem;
      box-shadow: var(--green-glow);
    }

    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 25px rgba(34, 197, 94, 0.6);
    }

    .message-box {
      display: none;
      padding: 0.75rem;
      border-radius: 0.75rem;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 1rem;
      text-align: center;
    }

    .message-box.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    .message-box.success {
      display: block;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid var(--border-accent);
      color: var(--accent-neon);
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.75rem;
      color: #3f3f46;
      border-top: 1px solid rgba(255, 255, 255, 0.03);
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="container">
      <div class="header-content">
        <div class="logo-area">
          <div class="logo-icon">
            <i data-lucide="check-circle-2" style="width: 22px; height: 22px; stroke-width: 2.5;"></i>
          </div>
          <div>
            <h1 style="font-size: 1.1rem; font-weight: 800; color: #fff; letter-spacing: -0.02em;">Habit Pulse</h1>
          </div>
        </div>

        <a href="habitos.html" class="nav-link">
          <i data-lucide="layout-dashboard" style="width: 16px; height: 16px;"></i>
          <span>Painel</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main>
    <div class="auth-card">
      
      <!-- Alternador Entrar / Registar -->
      <div class="tabs-container">
        <button id="tabLoginBtn" class="tab-btn active" onclick="switchTab('login')">Entrar</button>
        <button id="tabRegisterBtn" class="tab-btn" onclick="switchTab('register')">Registar</button>
      </div>

      <!-- Caixa de Feedback -->
      <div id="feedbackMsg" class="message-box"></div>

      <!-- Formulário de Login -->
      <form id="loginForm">
        <h2 class="form-title">Bem-vindo de volta!</h2>
        <p class="form-subtitle">Aceda à sua conta para sincronizar o seu progresso.</p>

        <div class="form-group">
          <label class="form-label">E-mail</label>
          <div class="input-wrapper">
            <i data-lucide="mail" class="input-icon"></i>
            <input type="email" id="loginEmail" required placeholder="seuemail@exemplo.com" class="form-input">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Palavra-passe</label>
          <div class="input-wrapper">
            <i data-lucide="lock" class="input-icon"></i>
            <input type="password" id="loginPassword" required placeholder="••••••••" class="form-input">
          </div>
        </div>

        <button type="submit" class="btn-submit">Entrar na Conta</button>
      </form>

      <!-- Formulário de Cadastro -->
      <form id="registerForm" style="display: none;">
        <h2 class="form-title">Criar nova conta</h2>
        <p class="form-subtitle">Registe-se para começar a gerir os seus hábitos.</p>

        <div class="form-group">
          <label class="form-label">Nome Completo</label>
          <div class="input-wrapper">
            <i data-lucide="user" class="input-icon"></i>
            <input type="text" id="regName" required placeholder="O seu nome" class="form-input">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">E-mail</label>
          <div class="input-wrapper">
            <i data-lucide="mail" class="input-icon"></i>
            <input type="email" id="regEmail" required placeholder="seuemail@exemplo.com" class="form-input">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Palavra-passe</label>
          <div class="input-wrapper">
            <i data-lucide="lock" class="input-icon"></i>
            <input type="password" id="regPassword" required placeholder="Mínimo 6 caracteres" class="form-input" minlength="6">
          </div>
        </div>

        <button type="submit" class="btn-submit">Criar Conta</button>
      </form>

    </div>
  </main>

  <footer>
    Habit Pulse &copy; Monitorização de Hábitos e Tempo de Uso
  </footer>

  <script>
    const STORAGE_USERS_KEY = 'hp_registered_users_v1';
    const STORAGE_SESSION_KEY = 'hp_user_session_v1';

    let registeredUsers = JSON.parse(localStorage.getItem(STORAGE_USERS_KEY)) || [];

    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const tabLoginBtn = document.getElementById('tabLoginBtn');
    const tabRegisterBtn = document.getElementById('tabRegisterBtn');
    const feedbackMsg = document.getElementById('feedbackMsg');

    function switchTab(tab) {
      feedbackMsg.className = 'message-box';
      feedbackMsg.style.display = 'none';

      if (tab === 'login') {
        loginForm.style.display = 'block';
        registerForm.style.display = 'none';
        tabLoginBtn.classList.add('active');
        tabRegisterBtn.classList.remove('active');
      } else {
        loginForm.style.display = 'none';
        registerForm.style.display = 'block';
        tabRegisterBtn.classList.add('active');
        tabLoginBtn.classList.remove('active');
      }
    }

    function showMessage(text, type) {
      feedbackMsg.textContent = text;
      feedbackMsg.className = `message-box ${type}`;
    }

    // Registo de Conta
    registerForm.onsubmit = (e) => {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim().toLowerCase();
      const password = document.getElementById('regPassword').value;

      const userExists = registeredUsers.some(u => u.email === email);
      if (userExists) {
        showMessage('Este e-mail já está registado.', 'error');
        return;
      }

      const newUser = { id: Date.now().toString(), name, email, password };
      registeredUsers.push(newUser);
      localStorage.setItem(STORAGE_USERS_KEY, JSON.stringify(registeredUsers));

      localStorage.setItem(STORAGE_SESSION_KEY, JSON.stringify({ id: newUser.id, name: newUser.name, email: newUser.email }));
      
      showMessage('Conta criada com sucesso! A entrar...', 'success');
      setTimeout(() => {
        window.location.href = 'habitos.html';
      }, 1000);
    };

    // Login na Conta
    loginForm.onsubmit = (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim().toLowerCase();
      const password = document.getElementById('loginPassword').value;

      const user = registeredUsers.find(u => u.email === email && u.password === password);

      if (!user) {
        showMessage('E-mail ou palavra-passe incorretos.', 'error');
        return;
      }

      localStorage.setItem(STORAGE_SESSION_KEY, JSON.stringify({ id: user.id, name: user.name, email: user.email }));

      showMessage('Login efetuado! A entrar...', 'success');
      setTimeout(() => {
        window.location.href = 'habitos.html';
      }, 800);
    };

    lucide.createIcons();
  </script>
</body>
</html>
