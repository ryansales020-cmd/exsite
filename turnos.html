<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Pulse - Calendário de Turnos</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    
    :root {
      --bg-main: #030407;
      --bg-card: rgba(13, 16, 23, 0.75);
      --bg-card-hover: rgba(22, 27, 38, 0.85);
      --border-card: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(34, 197, 94, 0.3);
      --accent-green: #22c55e;
      --accent-neon: #4ade80;
      --green-glow: 0 0 25px rgba(34, 197, 94, 0.4);
      --text-main: #f4f4f5;
      --text-muted: #71717a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(34, 197, 94, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(16, 185, 129, 0.05) 0%, transparent 40%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-main);
    }
    ::-webkit-scrollbar-thumb {
      background: #1f2937;
      border-radius: 99px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-green);
    }

    /* Header */
    header {
      border-bottom: 1px solid var(--border-card);
      background: rgba(3, 4, 7, 0.8);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.25rem;
      width: 100%;
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 76px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logo-icon {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      background: linear-gradient(135deg, #22c55e 0%, #10b981 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      box-shadow: var(--green-glow);
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(20, 24, 33, 0.9);
      border: 1px solid var(--border-card);
      color: var(--text-main);
      text-decoration: none;
      padding: 0.6rem 1.125rem;
      border-radius: 1rem;
      font-size: 0.875rem;
      font-weight: 700;
      transition: all 0.2s ease;
    }

    .nav-link:hover {
      border-color: var(--accent-green);
      color: var(--accent-neon);
      box-shadow: var(--green-glow);
    }

    /* Layout Principal */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem;
      flex: 1;
      width: 100%;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
    }

    @media (min-width: 900px) {
      .main-grid {
        grid-template-columns: 1.3fr 1fr;
      }
    }

    /* Cards */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 1.75rem;
      padding: 1.75rem;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    /* Calendário */
    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.75rem;
    }

    .calendar-nav {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      padding: 0.35rem;
      border-radius: 1rem;
      border: 1px solid var(--border-card);
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.5rem;
      border-radius: 0.75rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .weekdays-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.5rem;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.875rem;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.5rem;
    }

    .day-cell {
      position: relative;
      height: 4.5rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0.4rem;
      border-radius: 1.25rem;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      cursor: pointer;
      overflow: hidden;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .day-cell:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .day-cell.selected {
      border-color: #fff !important;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    }

    .day-number {
      position: relative;
      z-index: 10;
      font-size: 0.9375rem;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
    }

    /* Formulários e Inputs */
    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .form-input {
      width: 100%;
      background-color: #030407;
      border: 1px solid var(--border-card);
      border-radius: 0.875rem;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      color: #fff;
      outline: none;
      font-family: inherit;
    }

    .form-input:focus {
      border-color: var(--accent-green);
      box-shadow: var(--green-glow);
    }

    .notes-textarea {
      width: 100%;
      height: 90px;
      background-color: #030407;
      border: 1px solid var(--border-card);
      border-radius: 0.875rem;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      color: #fff;
      outline: none;
      resize: none;
      font-family: inherit;
      transition: all 0.2s;
    }

    .notes-textarea:focus {
      border-color: var(--accent-green);
      box-shadow: var(--green-glow);
    }

    /* Lista de Seleção de Turnos para o Dia */
    .shift-checkbox-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-height: 150px;
      overflow-y: auto;
      padding-right: 0.25rem;
    }

    .shift-checkbox-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.625rem 0.875rem;
      background: #030407;
      border: 1px solid var(--border-card);
      border-radius: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .shift-checkbox-item:hover {
      border-color: rgba(255, 255, 255, 0.2);
    }

    .shift-checkbox-item.checked {
      border-color: var(--accent-green);
      background: rgba(34, 197, 94, 0.08);
    }

    /* Gerenciador de Turnos (Criar Novo) */
    .custom-shifts-manager {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .custom-shift-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(3, 4, 7, 0.6);
      padding: 0.5rem 0.75rem;
      border-radius: 0.75rem;
      border: 1px solid var(--border-card);
      font-size: 0.8125rem;
    }

    .btn-action {
      background: linear-gradient(135deg, #22c55e, #15803d);
      color: #000;
      font-weight: 800;
      font-size: 0.8125rem;
      padding: 0.625rem 1rem;
      border-radius: 0.75rem;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-action:hover {
      box-shadow: var(--green-glow);
    }

    footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.75rem;
      color: #3f3f46;
      border-top: 1px solid rgba(255, 255, 255, 0.03);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="container">
      <div class="header-content">
        <div class="logo-area">
          <div class="logo-icon">
            <i data-lucide="briefcase" style="width: 26px; height: 26px; stroke-width: 2.5;"></i>
          </div>
          <div>
            <h1 style="font-size: 1.35rem; font-weight: 800; color: #fff; letter-spacing: -0.02em;">Turnos & Notas</h1>
            <p style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600;">Calendário Personalizado</p>
          </div>
        </div>

        <div>
          <a href="index.html" class="nav-link">
            <i data-lucide="check-circle-2" style="width: 18px; height: 18px; color: var(--accent-neon);"></i>
            <span>Monitor de Hábitos</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main>
    <div class="main-grid">
      
      <!-- Lado Esquerdo: Calendário -->
      <div style="display: flex; flex-direction: column; gap: 1.5rem;">
        <div class="card">
          <div class="calendar-header">
            <div>
              <h2 id="calendarMonthYear" style="font-size: 1.45rem; font-weight: 800; text-transform: capitalize; color: #fff;">Carregando...</h2>
              <p style="font-size: 0.8125rem; color: var(--text-muted); margin-top: 0.2rem;">Selecione um dia para gerenciar turnos e notas</p>
            </div>
            <div class="calendar-nav">
              <button id="prevMonthBtn" class="icon-btn"><i data-lucide="chevron-left" style="width: 20px; height: 20px;"></i></button>
              <button id="todayBtn" class="icon-btn" style="padding: 0.4rem 0.875rem; font-size: 0.75rem; font-weight: 700;">Hoje</button>
              <button id="nextMonthBtn" class="icon-btn"><i data-lucide="chevron-right" style="width: 20px; height: 20px;"></i></button>
            </div>
          </div>

          <div class="weekdays-grid">
            <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
          </div>

          <div id="calendarGrid" class="days-grid">
            <!-- Renderizado via JS -->
          </div>
        </div>

        <!-- Criar e Gerenciar Turnos Personalizados -->
        <div class="card">
          <h3 style="font-size: 1.125rem; font-weight: 800; color: #fff; margin-bottom: 1rem;">Criar Novo Turno</h3>
          <form id="createShiftForm" style="display: flex; gap: 0.75rem; align-items: flex-end;">
            <div style="flex: 1; margin-bottom: 0;">
              <label class="form-label">Nome do Turno</label>
              <input type="text" id="newShiftName" required placeholder="Ex: Manhã, Folga, Plantão" class="form-input">
            </div>
            <div style="width: 50px; margin-bottom: 0;">
              <label class="form-label">Cor</label>
              <input type="color" id="newShiftColor" value="#22c55e" style="width: 100%; height: 42px; background: #030407; border: 1px solid var(--border-card); border-radius: 0.875rem; cursor: pointer; padding: 2px;">
            </div>
            <button type="submit" class="btn-action" style="height: 42px;">Adicionar</button>
          </form>

          <div style="margin-top: 1.25rem;">
            <label class="form-label" style="margin-bottom: 0.5rem;">Seus Turnos Cadastrados</label>
            <div id="customShiftsList" class="custom-shifts-manager">
              <!-- Lista dinâmica -->
            </div>
          </div>
        </div>
      </div>

      <!-- Lado Direito: Editor do Dia Selecionado -->
      <div>
        <div class="card" style="position: sticky; top: 96px;">
          <h3 style="font-size: 1.35rem; font-weight: 800; color: #fff;">Detalhes do Dia</h3>
          <p id="selectedDateTitle" style="font-size: 0.8125rem; color: var(--accent-neon); font-weight: 700; margin-top: 0.2rem;">Hoje</p>

          <!-- Seleção de Turnos para o Dia (Máximo 3) -->
          <div style="margin-top: 1.5rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
              <label class="form-label" style="margin-bottom: 0;">Turnos do Dia (Max. 3)</label>
              <span id="shiftCountIndicator" style="font-size: 0.75rem; color: var(--text-muted); font-weight: 700;">0/3 selecionados</span>
            </div>
            <div id="dayShiftSelector" class="shift-checkbox-list">
              <!-- Renderizado via JS -->
            </div>
          </div>

          <!-- Anotações -->
          <div style="margin-top: 1.5rem;">
            <label class="form-label">Observações / Notas</label>
            <textarea id="dayNotesInput" class="notes-textarea" placeholder="Adicione notas para este dia..."></textarea>
          </div>

          <button id="saveDayBtn" class="btn-action" style="width: 100%; margin-top: 1.25rem; padding: 0.875rem; font-size: 0.875rem;">Guardar Informações</button>
          <button id="clearDayBtn" style="width: 100%; background: transparent; border: none; color: #ef4444; font-size: 0.8125rem; font-weight: 700; margin-top: 0.75rem; cursor: pointer;">Limpar Dia</button>
        </div>
      </div>

    </div>
  </main>

  <footer>
    Habit Pulse &copy; Calendário Personalizado de Turnos
  </footer>

  <script>
    // Chave única e garantida para os turnos no LocalStorage
    const STORAGE_KEY_SHIFTS = 'hp_shifts_v3';
    const STORAGE_KEY_CUSTOM = 'hp_custom_shifts_v3';

    let customShifts = JSON.parse(localStorage.getItem(STORAGE_KEY_CUSTOM)) || [
      { id: '1', name: 'Manhã', color: '#fbbf24' },
      { id: '2', name: 'Tarde', color: '#f97316' },
      { id: '3', name: 'Noite', color: '#c084fc' },
      { id: '4', name: 'Folga', color: '#22c55e' }
    ];

    let shiftData = JSON.parse(localStorage.getItem(STORAGE_KEY_SHIFTS)) || {};
    
    let currentDate = new Date();
    let selectedDateStr = formatDateKey(new Date());

    const calendarGrid = document.getElementById('calendarGrid');
    const calendarMonthYear = document.getElementById('calendarMonthYear');
    const selectedDateTitle = document.getElementById('selectedDateTitle');
    const dayNotesInput = document.getElementById('dayNotesInput');
    const createShiftForm = document.getElementById('createShiftForm');
    const customShiftsList = document.getElementById('customShiftsList');
    const dayShiftSelector = document.getElementById('dayShiftSelector');
    const shiftCountIndicator = document.getElementById('shiftCountIndicator');

    function formatDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function formatReadableDate(dateKey) {
      const [y, m, d] = dateKey.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      if (dateKey === formatDateKey(new Date())) return 'Hoje';
      return date.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
    }

    function init() {
      renderCalendar();
      renderCustomShiftsManager();
      loadSelectedDayData();
      setupEventListeners();
      lucide.createIcons();
    }

    function renderCalendar() {
      // Recarrega os dados do localStorage para garantir sincronia ao voltar de outra página
      shiftData = JSON.parse(localStorage.getItem(STORAGE_KEY_SHIFTS)) || {};

      calendarGrid.innerHTML = '';
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const monthName = currentDate.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
      calendarMonthYear.textContent = monthName;

      const firstDayIndex = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const todayKey = formatDateKey(new Date());

      for (let i = 0; i < firstDayIndex; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.style.height = '4.5rem';
        calendarGrid.appendChild(emptyCell);
      }

      for (let day = 1; day <= totalDays; day++) {
        const dateObj = new Date(year, month, day);
        const dateKey = formatDateKey(dateObj);
        const data = shiftData[dateKey];
        const isSelected = dateKey === selectedDateStr;
        const isToday = dateKey === todayKey;

        const dayBtn = document.createElement('button');
        dayBtn.className = `day-cell ${isSelected ? 'selected' : ''}`;
        dayBtn.onclick = () => selectDate(dateKey);

        // Preenchimento Proporcional (1, 2 ou 3 cores divididas)
        let bgStyle = 'background: rgba(255, 255, 255, 0.02);';
        if (data && data.shiftIds && data.shiftIds.length > 0) {
          const colors = data.shiftIds.map(id => {
            const s = customShifts.find(cs => cs.id === id);
            return s ? s.color : null;
          }).filter(Boolean);

          if (colors.length === 1) {
            bgStyle = `background: ${colors[0]};`;
          } else if (colors.length === 2) {
            bgStyle = `background: linear-gradient(135deg, ${colors[0]} 50%, ${colors[1]} 50%);`;
          } else if (colors.length >= 3) {
            bgStyle = `background: linear-gradient(135deg, ${colors[0]} 33.33%, ${colors[1]} 33.33%, ${colors[1]} 66.66%, ${colors[2]} 66.66%);`;
          }
        }

        dayBtn.style.cssText += bgStyle;

        const noteDot = (data && data.notes && data.notes.trim() !== '') 
          ? `<div style="width: 6px; height: 6px; background: #fff; border-radius: 50%; position: absolute; top: 6px; right: 6px; box-shadow: 0 0 8px rgba(0,0,0,0.8);"></div>` 
          : '';

        dayBtn.innerHTML = `
          ${noteDot}
          <span class="day-number" style="${isToday && (!data || !data.shiftIds || data.shiftIds.length === 0) ? 'color: var(--accent-neon); text-decoration: underline;' : ''}">
            ${day}
          </span>
        `;
        calendarGrid.appendChild(dayBtn);
      }
    }

    function selectDate(dateKey) {
      selectedDateStr = dateKey;
      renderCalendar();
      loadSelectedDayData();
    }

    function renderCustomShiftsManager() {
      customShiftsList.innerHTML = '';
      if (customShifts.length === 0) {
        customShiftsList.innerHTML = `<span style="font-size: 0.75rem; color: var(--text-muted);">Nenhum turno criado ainda.</span>`;
        return;
      }

      customShifts.forEach(shift => {
        const row = document.createElement('div');
        row.className = 'custom-shift-row';
        row.innerHTML = `
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <div style="width: 12px; height: 12px; border-radius: 50%; background-color: ${shift.color};"></div>
            <span style="font-weight: 600; color: #fff;">${shift.name}</span>
          </div>
          <button onclick="deleteCustomShift('${shift.id}')" style="background: transparent; border: none; color: #71717a; cursor: pointer; font-size: 0.75rem;" title="Apagar">✕</button>
        `;
        customShiftsList.appendChild(row);
      });
    }

    function loadSelectedDayData() {
      shiftData = JSON.parse(localStorage.getItem(STORAGE_KEY_SHIFTS)) || {};
      selectedDateTitle.textContent = formatReadableDate(selectedDateStr);
      const data = shiftData[selectedDateStr] || { shiftIds: [], notes: '' };
      
      dayNotesInput.value = data.notes || '';
      renderDayShiftSelector(data.shiftIds || []);
    }

    function renderDayShiftSelector(selectedIds) {
      dayShiftSelector.innerHTML = '';
      shiftCountIndicator.textContent = `${selectedIds.length}/3 selecionados`;

      if (customShifts.length === 0) {
        dayShiftSelector.innerHTML = `<span style="font-size: 0.75rem; color: var(--text-muted);">Crie turnos ao lado primeiro.</span>`;
        return;
      }

      customShifts.forEach(shift => {
        const isChecked = selectedIds.includes(shift.id);
        const item = document.createElement('div');
        item.className = `shift-checkbox-item ${isChecked ? 'checked' : ''}`;
        
        item.innerHTML = `
          <div style="display: flex; align-items: center; gap: 0.75rem;">
            <div style="width: 14px; height: 14px; border-radius: 50%; background-color: ${shift.color};"></div>
            <span style="font-size: 0.875rem; font-weight: 600; color: #fff;">${shift.name}</span>
          </div>
          <div style="width: 18px; height: 18px; border-radius: 4px; border: 2px solid ${isChecked ? 'var(--accent-green)' : '#3f3f46'}; background: ${isChecked ? 'var(--accent-green)' : 'transparent'}; display: flex; align-items: center; justify-content: center; color: #000; font-size: 11px; font-weight: bold;">
            ${isChecked ? '✓' : ''}
          </div>
        `;

        item.onclick = () => {
          let currentSelected = [...selectedIds];
          if (isChecked) {
            currentSelected = currentSelected.filter(id => id !== shift.id);
          } else {
            if (currentSelected.length >= 3) {
              alert('Você só pode selecionar no máximo 3 turnos por dia!');
              return;
            }
            currentSelected.push(shift.id);
          }
          if (!shiftData[selectedDateStr]) shiftData[selectedDateStr] = {};
          shiftData[selectedDateStr].shiftIds = currentSelected;
          
          // Salva imediatamente ao selecionar para garantir persistência robusta
          localStorage.setItem(STORAGE_KEY_SHIFTS, JSON.stringify(shiftData));

          renderDayShiftSelector(currentSelected);
          renderCalendar();
        };

        dayShiftSelector.appendChild(item);
      });
    }

    createShiftForm.onsubmit = (e) => {
      e.preventDefault();
      const name = document.getElementById('newShiftName').value.trim();
      const color = document.getElementById('newShiftColor').value;
      if (!name) return;

      const newShift = {
        id: Date.now().toString(),
        name,
        color
      };

      customShifts.push(newShift);
      localStorage.setItem(STORAGE_KEY_CUSTOM, JSON.stringify(customShifts));
      document.getElementById('newShiftName').value = '';
      renderCustomShiftsManager();
      loadSelectedDayData();
    };

    function deleteCustomShift(id) {
      if (!confirm('Deseja apagar este turno? Ele será removido dos dias agendados.')) return;
      customShifts = customShifts.filter(s => s.id !== id);
      localStorage.setItem(STORAGE_KEY_CUSTOM, JSON.stringify(customShifts));

      Object.keys(shiftData).forEach(date => {
        if (shiftData[date].shiftIds) {
          shiftData[date].shiftIds = shiftData[date].shiftIds.filter(shiftId => shiftId !== id);
        }
      });
      localStorage.setItem(STORAGE_KEY_SHIFTS, JSON.stringify(shiftData));

      renderCustomShiftsManager();
      renderCalendar();
      loadSelectedDayData();
    }

    function setupEventListeners() {
      document.getElementById('prevMonthBtn').onclick = () => { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); };
      document.getElementById('nextMonthBtn').onclick = () => { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); };
      document.getElementById('todayBtn').onclick = () => { currentDate = new Date(); selectedDateStr = formatDateKey(new Date()); renderCalendar(); loadSelectedDayData(); };

      document.getElementById('saveDayBtn').onclick = () => {
        const notes = dayNotesInput.value.trim();
        const currentData = shiftData[selectedDateStr] || { shiftIds: [] };

        if ((currentData.shiftIds && currentData.shiftIds.length > 0) || notes) {
          shiftData[selectedDateStr] = { shiftIds: currentData.shiftIds || [], notes };
        } else {
          delete shiftData[selectedDateStr];
        }

        localStorage.setItem(STORAGE_KEY_SHIFTS, JSON.stringify(shiftData));
        renderCalendar();
        alert('Informações do dia guardadas com sucesso!');
      };

      document.getElementById('clearDayBtn').onclick = () => {
        delete shiftData[selectedDateStr];
        localStorage.setItem(STORAGE_KEY_SHIFTS, JSON.stringify(shiftData));
        dayNotesInput.value = '';
        loadSelectedDayData();
        renderCalendar();
      };
    }

    init();
  </script>
</body>
</html>
